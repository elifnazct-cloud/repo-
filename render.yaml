services:
  - type: web
    name: beavizor-test
    runtime: ruby
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec ruby server.rb
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: EMAIL_MODE
        value: console
      - key: TEST_ACCESS_PASSWORD
        generateValue: true
